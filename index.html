<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDMP | Портфолио</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="cursor-glow"></div>
    <div class="particles" id="particles"></div>

    <div class="spotify-player glass">
        <div class="player-info">
            <span class="track-name">Гимн XIVIVIDE</span>
        </div>
        <div class="player-controls">
            <button class="play-btn" id="playBtn" aria-label="Play/Pause">
                <svg class="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <svg class="pause-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
            </button>
            <div class="progress-container">
                <span class="time current" id="currentTime">0:00</span>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span class="time total" id="totalTime">0:00</span>
            </div>
        </div>
        <audio id="audioPlayer" src="assets/1.mp3"></audio>
    </div>

    <nav class="nav glass">
        <div class="nav-content">
            <a href="#" class="logo">
                <span class="logo-text">KDMP</span>
            </a>
            <div class="nav-links">
                <a href="#about" class="nav-link">О мне</a>
            </div>
            <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
                <span class="theme-icon sun">☀</span>
                <span class="theme-icon moon">☾</span>
            </button>
        </div>
    </nav>

    <section class="hero" id="hero">
        <div class="hero-content">
            <h1 class="hero-title">
                <span class="title-line accent-text">KDMP</span>
            </h1>
            <p class="hero-subtitle">
                Тролльский сервер для 
                <span class="highlight">школоты</span>
            </p>
            <div class="hero-buttons">
                <a href="#about" class="btn btn-primary">
                    <span>Узнать больше</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </a>
            </div>
        </div>
        <div class="hero-visual">
            <img src="assets/image.png" alt="KDMP" class="hero-image glass">
        </div>
    </section>

    <section class="about section" id="about">
        <div class="section-header">
            <span class="section-tag">// про наш сервер</span>
        </div>
        <div class="about-grid">
            <a class="about-card glass" href="https://discord.gg/95Wv4b3rrq" target="_blank" rel="noopener">
                <div class="about-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
                    </svg>
                </div>
                <h3>Discord</h3>
                <p>Здесь вы сможете играть и троллиться с мелкими звиздюками и при этом не получить партию троллина че маме че папе от пивного пузатика</p>
            </a>
        </div>
    </section>

    <footer class="footer">
        <p>KDMP ©  2026 | Сделано фембоями за датебаё</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
